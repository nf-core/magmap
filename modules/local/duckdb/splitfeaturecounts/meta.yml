name: "duckdb_splitfeaturecounts"
description: Split a combined-feature-type featureCounts table into one native-format file per feature type
keywords:
  - featurecounts
  - split
  - annotation
tools:
  - "duckdb":
      description: "An in-process SQL OLAP database management system"
      homepage: "https://duckdb.org"
      documentation: "https://duckdb.org/docs/"
      tool_dev_url: "https://github.com/duckdb/duckdb"
      licence:
        - "MIT"
      identifier: "biotools:duckdb"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information. `feature` is a comma-separated list of the feature types to write
          e.g. `[ id:'sample1', feature:'CDS,tRNA' ]`
    - counts:
        type: file
        description: Raw featureCounts output for one sample, counted against all feature types combined
        pattern: "*.featureCounts.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - ftypes:
        type: file
        description: ORF-to-feature-type mapping (e.g. the prokka-annotations.tsv.gz from CATPROKKATSVS), with `orf` and `ftype` columns
        pattern: "*.tsv{,.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV

output:
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.*.featureCounts.tsv":
          type: file
          description: One featureCounts-shaped file per requested feature type, `<prefix>.<ftype>.featureCounts.tsv`, starting with a comment line. The rows of each file keep their order in the input.
          pattern: "*.featureCounts.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_duckdb:
    - - ${task.process}:
          type: string
          description: The name of the process
      - duckdb:
          type: string
          description: The name of the tool
      - "duckdb -noheader -list -c 'SELECT substr(version(), 2)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - duckdb:
          type: string
          description: The name of the tool
      - "duckdb -noheader -list -c 'SELECT substr(version(), 2)'":
          type: eval
          description: The expression to obtain the version of the tool
