name: "duckdb_joinfeaturecountsaccno"
description: Join genome accession numbers onto a collected featureCounts table
keywords:
  - featurecounts
  - join
  - genome
tools:
  - "duckdb":
      description: "An in-process SQL OLAP database management system"
      homepage: "https://duckdb.org"
      documentation: "https://duckdb.org/docs/"
      tool_dev_url: "https://github.com/duckdb/duckdb"
      licence:
        - "MIT"
      identifier: "biotools:duckdb"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - counts:
        type: file
        description: Collected featureCounts long-format table, as produced by CUSTOM_COLLECTFEATURECOUNTS, with an `orf` column
        pattern: "*.counts.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - g2ids:
        type: file
        description: Table mapping genome accessions to ORF IDs, with `accno` and `orf` columns
        pattern: "*genomes2orfs.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.counts.tsv.gz":
          type: file
          description: The counts table with the genome accession as first column. Rows without a matching ORF are dropped, the others keep their order in the input.
          pattern: "*.counts.tsv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_duckdb:
    - - ${task.process}:
          type: string
          description: The name of the process
      - duckdb:
          type: string
          description: The name of the tool
      - "duckdb -noheader -list -c 'SELECT substr(version(), 2)'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - duckdb:
          type: string
          description: The name of the tool
      - "duckdb -noheader -list -c 'SELECT substr(version(), 2)'":
          type: eval
          description: The expression to obtain the version of the tool
