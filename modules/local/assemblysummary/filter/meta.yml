# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "assemblysummary_filter"
description: Extract the FTP path of selected accessions from NCBI assembly summary files
keywords:
  - ncbi
  - assembly summary
  - filter
tools:
  - "gawk":
      description: "GNU awk, a pattern scanning and text processing language"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      licence: ["GPL-3.0-or-later"]
      identifier: ""

input:
  - accessions:
      type: file
      description: Text file with one assembly accession per line
      pattern: "*.txt"
      ontologies:
        - edam: http://edamontology.org/format_2330 # Textual format
  - summaries:
      type: file
      description: NCBI assembly summary files, optionally gzipped
      ontologies:
        - edam: http://edamontology.org/format_2330 # Textual format
output:
  tsv:
    - ncbi_genomeinfo.tsv:
        type: file
        description: Tab-separated file with the columns `accno` and `ftp_path`, one row per selected accession found in the summaries
        pattern: "ncbi_genomeinfo.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - gawk 'BEGIN { print PROCINFO["version"] }':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - gawk 'BEGIN { print PROCINFO["version"] }':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
