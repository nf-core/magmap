# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "tidyverse_selectgenomespecies"
description: Given local and remote candidate genome accessions representing the same GTDB species, select which one(s) to keep according to a species preference ('local', 'completeness' or 'gtdb')
keywords:
  - genome
  - taxonomy
  - species
tools:
  - "tidyverse":
      description: "The 'tidyverse' is a set of packages that work in harmony because
        they share common data representations and 'API' design. This package is designed
        to make it easy to install and load multiple 'tidyverse' packages in a single
        step. Learn more about the 'tidyverse' at <https://www.tidyverse.org>."
      homepage: "None"
      documentation: "None"
      tool_dev_url: "None"
      doi: ""
      licence: ["MIT"]
      identifier: null

input:
  - local_accessions:
      type: file
      description: Single column file (no header) with genome accessions of the local genomes selected for this run
      pattern: "*.txt"
  - remote_candidates:
      type: file
      description: Single column file (no header) with genome accessions of the remote genomes Sourmash selected for fetching
      pattern: "*.txt"
  - gtdbtk_metadata:
      type: files
      description: GTDB-Tk output files, e.g. `gtdbtk.bac120.summary.tsv`, used for local genome species assignments
      pattern: "*.tsv(.gz)?"
  - gtdb_metadata:
      type: files
      description: GTDB metadata files, i.e. ar53_metadata_rNNN.tsv.gz and bac120_metadata_rNNN.tsv.gz, used for remote genome species assignments and, for 'completeness'/'gtdb', their completeness/contamination
      pattern: "*.tsv(.gz)?"
  - checkm_metadata:
      type: files
      description: CheckM/CheckM2 output files, used for local genome completeness/contamination when species_preference is 'completeness' or 'gtdb'
      pattern: "*.tsv(.gz)?"
  - species_preference:
      type: value
      description: "One of 'local', 'completeness' or 'gtdb', selecting the criterion used to pick a genome among duplicated species"

output:
  kept_remote:
    - "*.kept_remote_accessions.txt":
        type: file
        description: Single column file (no header) with the remote genome accessions that survived species selection
        pattern: "*.kept_remote_accessions.txt"
  kept_local:
    - "*.kept_local_accessions.txt":
        type: file
        description: Single column file (no header) with the local genome accessions that survived species selection
        pattern: "*.kept_local_accessions.txt"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML

authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
