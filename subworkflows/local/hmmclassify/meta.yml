# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "hmmclassify"
description: Search proteins with HMM profiles, rank the hits, attach genome accessions and extract the sequences with hits
keywords:
  - hmmer
  - hmmsearch
  - classification
components:
  - hmmer/hmmsearch
  - hmmer/formattsv
  - duckdb/table2parquet
  - hmmer/hmmrank
  - tidyverse/joinhmmrankaccno
  - seqtk/hmmhitfaas
input:
  - ch_hmms:
      type: file
      description: |
        HMM profiles, one file per profile
        Structure: path(hmm)
      pattern: "*.{hmm,hmm.gz}"
  - ch_faa:
      type: file
      description: |
        Protein FASTA file to search
        Structure: [ val(meta), path(faa) ]
      pattern: "*.{faa,faa.gz}"
  - ch_genomes2orfs:
      type: file
      description: |
        Table mapping genome accessions to ORF IDs, as produced by GENOMES2ORFS
        Structure: path(genomes2orfs)
      pattern: "*.genomes2orfs.tsv.gz"
output:
  - tbl:
      type: file
      description: |
        hmmsearch per-sequence hit table, one per profile
        Structure: [ val(meta), path(tbl) ]
      pattern: "*.tbl.gz"
  - hmmrank:
      type: file
      description: |
        Ranked hits for all profiles with genome accession, genome name and ORF ID
        Structure: [ val(meta), path(hmmrank) ]
      pattern: "*.hmmrank.tsv.gz"
  - faas:
      type: file
      description: |
        Protein FASTA files with the sequences with hits, one per profile
        Structure: [ val(meta), path(faas) ]
      pattern: "hits/*.faa.gz"
authors:
  - "@danilodileo"
maintainers:
  - "@danilodileo"
